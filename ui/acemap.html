<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acemap Results Viewer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background: #f7f7fb; color: #1f1f1f; }
    h1 { margin-bottom: 8px; }
    .panel { margin-bottom: 16px; padding: 16px; background: #fff; border: 1px solid #e5e5ef; border-radius: 8px; }
    .group { margin-bottom: 24px; padding: 16px; background: #fff; border: 1px solid #e5e5ef; border-radius: 8px; }
    .intent-label { font-size: 12px; color: #555; letter-spacing: 0.3px; }
    .intent { font-weight: 700; margin: 4px 0 10px 0; color: #333; font-size: 15px; }
    .query-label { font-size: 12px; color: #555; letter-spacing: 0.3px; }
    .query { font-weight: 800; margin: 4px 0 12px 0; color: #0d47a1; font-size: 20px; }
    .card { margin-bottom: 12px; padding: 12px; border: 1px solid #e5e5ef; border-radius: 6px; background: #fafafa; }
    .title { font-weight: 700; margin: 0 0 6px 0; }
    .meta { font-size: 13px; color: #555; margin: 0 0 6px 0; }
    .abstract { font-size: 14px; color: #333; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 12px; background: #e3f2fd; color: #0d47a1; font-size: 12px; margin-right: 6px; }
    a { color: #0d47a1; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .empty { color: #777; font-style: italic; }
    details { border: 1px solid #e5e5ef; border-radius: 8px; background: #fff; padding: 12px 14px; margin-bottom: 16px; }
    summary { cursor: pointer; font-weight: 700; }
    #report { margin-top: 8px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Acemap Results</h1>
  <p>Fetches runs/final_report.md and runs/acemap_results.json. Start a static server (e.g. python -m http.server 8000) then open http://localhost:8000/ui/acemap.html.</p>

  <div id="search-panel" class="panel">
    <h3>快速发起新研究</h3>
    <form id="search-form">
      <label for="query">研究问题</label><br />
      <textarea id="query" name="query" rows="3" style="width:100%; margin:6px 0;" placeholder="输入要研究的问题"></textarea>
      <button type="submit" style="padding:8px 14px; margin-right:8px;">开始研究</button>
      <span id="status"></span>
    </form>
  </div>

  <details open>
    <summary>最终报告（折叠/展开）</summary>
    <div id="report" class="panel">Loading report...</div>
  </details>

  <div id="container"></div>

  <script>
    async function loadReport() {
      const el = document.getElementById('report');
      try {
        const res = await fetch('../runs/final_report.md', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        el.innerHTML = marked.parse(md || 'No report yet.');
      } catch (err) {
        el.innerHTML = `<p class="empty">Failed to load final_report.md: ${err}</p>`;
      }
    }

    async function loadData() {
      const container = document.getElementById('container');
      try {
        const res = await fetch('../runs/acemap_results.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        render(data);
      } catch (err) {
        container.innerHTML = `<p class="empty">Failed to load acemap_results.json: ${err}</p>`;
      }
    }

    function render(data) {
      const container = document.getElementById('container');
      if (!data || data.length === 0) {
        container.innerHTML = '<p class="empty">No Acemap results yet.</p>';
        return;
      }

      const frag = document.createDocumentFragment();
      data.forEach(group => {
        const div = document.createElement('div');
        div.className = 'group';
        const task = group.task_id || 'task';
        const query = group.query || '';
        const intent = group.intent || group.brief || '';
        const intentBlock = intent ? `<div class="intent-label">研究意图</div><div class="intent">${intent}</div>` : '';
        div.innerHTML = `
          <div class="pill-label">搜索内容</div>
          <div class="pill">${task}</div>
          ${intentBlock}
          <div class="query-label">关键词</div>
          <div class="query">${query}</div>
        `;

        const results = group.results || [];
        if (results.length === 0) {
          const p = document.createElement('p');
          p.className = 'empty';
          p.textContent = 'No results for this query.';
          div.appendChild(p);
        } else {
          results.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            const title = r.title || 'Untitled';
            const url = r.url || '#';
            const authors = (r.authors || []).join(', ');
            const year = r.year || '';
            const venue = r.venue || r.source || '';
            const citations = r.citations != null ? ` | Cited: ${r.citations}` : '';
            const abstract = r.abstract ? r.abstract.slice(0, 600) + (r.abstract.length > 600 ? '…' : '') : '';
            card.innerHTML = `
              <div class="title"><a href="${url}" target="_blank" rel="noopener">${title}</a></div>
              <p class="meta">${authors || 'Unknown authors'}${year ? ' · ' + year : ''}${venue ? ' · ' + venue : ''}${citations}</p>
              <p class="abstract">${abstract || 'No abstract available.'}</p>
            `;
            div.appendChild(card);
          });
        }

        frag.appendChild(div);
      });

      container.innerHTML = '';
      container.appendChild(frag);
    }

    // Simple client to call backend API (uvicorn server on 8001)
    const API_BASE = 'http://localhost:8001/api';

    async function startResearch(query) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '提交中...';
      try {
        const res = await fetch(`${API_BASE}/research`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const runId = data.status; // status field carries run_id here
        statusEl.textContent = `已提交，运行ID: ${runId}，轮询状态中...`;
        pollStatus(runId);
      } catch (err) {
        statusEl.textContent = '提交失败: ' + err;
      }
    }

    async function pollStatus(runId) {
      const statusEl = document.getElementById('status');
      const poll = async () => {
        try {
          const res = await fetch(`${API_BASE}/research/${runId}/status`, { cache: 'no-cache' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (data.status === 'done') {
            statusEl.textContent = '完成，拉取结果...';
            await loadResult(runId);
            statusEl.textContent = '完成';
            return;
          }
          if (data.status === 'error') {
            statusEl.textContent = '失败: ' + (data.error || '未知错误');
            return;
          }
          statusEl.textContent = `运行中 (${data.status})...`;
          setTimeout(poll, 2000);
        } catch (err) {
          statusEl.textContent = '轮询失败: ' + err;
        }
      };
      poll();
    }

    async function loadResult(runId) {
      try {
        const res = await fetch(`${API_BASE}/research/${runId}/result`, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        // Update report and results from API payload
        document.getElementById('report').innerHTML = marked.parse(data.final_report || 'No report yet.');
        render(data.acemap_results || []);
      } catch (err) {
        const statusEl = document.getElementById('status');
        statusEl.textContent = '获取结果失败: ' + err;
      }
    }

    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = document.getElementById('query').value.trim();
      if (!q) return;
      await startResearch(q);
    });

    // Initial load from files (if any past runs exist)
    loadReport();
    loadData();
  </script>
</body>
</html>
